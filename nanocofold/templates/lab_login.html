<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoCoFold · Lab sign in</title>
<style>body{max-width:28rem;margin:12vh auto;padding:1.5rem;font:1rem/1.6 system-ui,sans-serif;color:#142d37;background:#f6f9f9}label,input,button{display:block}input,button{box-sizing:border-box;width:100%;padding:.7rem;margin:.3rem 0 1rem;font:inherit;border:1px solid #648187;border-radius:4px}button{background:#084957;color:white;cursor:pointer}[role=alert]{color:#8c301d}</style>
<h1>NanoCoFold</h1><p>연구실 계정으로 로그인하세요.<br><span lang="en">Sign in with your lab account.</span></p>
<!--LOGIN_ERROR-->
<form method="post" action="/lab/login"><label>담당자 / Account<input name="name" autocomplete="username" maxlength="48" required autofocus></label>
<label>비밀번호 / Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
<button>로그인 / Sign in</button></form></html>
