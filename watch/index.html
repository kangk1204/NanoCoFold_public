<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="nanocofold-media" content="local">
<title>NanoCoFold · Videos</title>
<style>
  :root {font-family: Inter, "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; color:#122f35; background:#f4f7f4; line-height:1.5;}
  * {box-sizing:border-box}
  body {margin:0}
  header {border-bottom:1px solid #c9d7d0}
  .bar, main {width:min(100% - 32px, 960px); margin:auto}
  .bar {display:flex; align-items:center; justify-content:space-between; min-height:64px; gap:12px}
  a {color:#00675e; text-underline-offset:.2em}
  .brand {color:#123239; font-weight:750; font-size:1.18rem; text-decoration:none}
  .lang {display:flex; gap:4px}
  button,.lang a,nav a {font:inherit; cursor:pointer}
  .lang a {padding:5px 9px; font-size:.875rem; border-radius:4px; text-decoration:none; color:#334f4c}
  .lang a[aria-current="true"] {background:#dce9e1; color:#123239; font-weight:700}
  main {padding:30px 0 44px}
  nav {display:flex; gap:9px; flex-wrap:wrap}
  nav a {border:1px solid #b6c9c1; color:#22534c; background:white; border-radius:5px; padding:7px 12px; text-decoration:none; font-size:.92rem}
  nav a[aria-current="page"] {background:#113b3f;color:#fff;border-color:#113b3f}
  h1 {font-weight:680; font-size:clamp(1.7rem,4.3vw,2.5rem); letter-spacing:-.035em; line-height:1.14; margin:22px 0 7px}
  #meta {margin:0 0 14px; color:#41635e; font-size:.96rem}
  video {display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:7px;background:#0d2931}
  #links {display:flex;flex-wrap:wrap;gap:9px 22px;margin:16px 0}
  details {border-top:1px solid #c4d0c8;padding-top:12px}
  summary {cursor:pointer;font-weight:650}
  ol {display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 12px; padding:0;list-style:none}
  li button {padding:6px 0;border:none;background:transparent;text-align:left;color:#156256}
  li time {font-size:.88rem; font-variant-numeric:tabular-nums; padding-right:8px;color:#4e6d63}
  a:focus-visible,button:focus-visible,summary:focus-visible,video:focus-visible {outline:3px solid #008375;outline-offset:3px}
  [hidden] {display:none!important}
  @media(max-width:480px){.bar{min-height:54px}main{padding-top:20px}.bar,main{width:calc(100% - 24px)}}
  #legacy {font-size:.9rem;color:#41635e}
  #captions {display:inline-flex;gap:1em;flex-wrap:wrap}
  video {object-fit:contain}
  .captionbar {display:flex;gap:16px;align-items:baseline;padding:10px 0 4px;flex-wrap:wrap;color:#294d50}
  .captionbar label {font-size:.88rem}
  .captionbar select {font:inherit;padding:4px 6px;border:1px solid #9eb7af;border-radius:4px;margin-left:5px}
  #spoken {margin:0;min-height:2.9em;max-width:78ch;font-size:1rem;line-height:1.45}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="https://github.com/kangk1204/NanoCoFold_public">NanoCoFold</a>
  <div class="lang"><a id="ko" lang="ko" hreflang="ko" href="?v=intro&amp;lang=ko">한국어</a><a id="en" lang="en" hreflang="en" href="?v=intro&amp;lang=en">English</a></div>
</div></header>
<main>
  <nav id="choices" aria-label="Videos"><a id="first-run" href="?v=first-run">First GPU experiment</a><a id="intro" href="?v=intro">Introduction</a><a id="install" href="?v=install">Ubuntu installation</a><a id="walkthrough" href="?v=walkthrough">Full walkthrough</a></nav>
  <h1 id="heading">NanoCoFold videos</h1><p id="meta"></p>
  <video controls playsinline preload="metadata" width="1920" height="1080" id="player" aria-labelledby="heading"></video>
  <div class="captionbar"><label><span id="cclabel">Subtitles</span><select id="cc"><option value="en">English</option><option value="ko">한국어</option><option value="off">Off</option></select></label><p id="spoken" aria-live="off"></p></div>
  <p id="status" role="status" hidden></p>
  <div id="links"><a id="download">Download MP4</a><a id="example-data" hidden></a><a id="recorded-result" hidden></a><span id="captions"></span><a id="guide">Installation guide</a><a id="release" href="https://github.com/kangk1204/NanoCoFold_public/releases/tag/v0.4.8">Release v0.4.8</a></div>
  <details id="chapters" hidden><summary></summary><ol></ol></details>
  <p id="legacy" hidden><a></a></p>
  <noscript><p><a href="https://github.com/kangk1204/NanoCoFold_public/releases/tag/v0.4.8">Download the videos / 영상 내려받기</a></p></noscript>
</main>
<script src="english-edition.js?edition=4e078c06f68c"></script>
<script>
(() => {
  const get = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const language = ["en","ko"].includes(q.get("lang")) ? q.get("lang") : (navigator.language.startsWith("ko") ? "ko" : "en");
  const ko = language === "ko";
  document.documentElement.lang = language;
  const repo = "https://github.com/kangk1204/NanoCoFold_public";
  const release = repo + "/releases/download/v0.4.8/";
  const ids = ["intro","install","walkthrough","first-run"];
  const id = ids.includes(q.get("v")) ? q.get("v") : "first-run";
  const item = filmCatalog[id];
  const labels = ko ? {
    "first-run":"첫 변이 실습", intro:"플랫폼 소개", install:"Ubuntu 설치 개요", walkthrough:"네 모드 소개", videos:"영상 선택", heading:["NanoCoFold 플랫폼 소개","Ubuntu에 NanoCoFold 설치하기","네 분석 모드 둘러보기","EGFR 나노바디 변이 10종 실습"],
    audio:"영어 음성 · 한국어·영어 자막", download:"MP4 내려받기", guide:"설치 명령어와 실습 안내", release:"v0.4.8 릴리스", chapters:"원하는 단계로 이동",
    legacy:"이전 한국어 음성 영상 내려받기", status:"영상을 열 수 없습니다. 아래에서 MP4를 내려받아 주세요."
  } : {
    "first-run":"First variant experiment", intro:"Introduction", install:"Installation overview", walkthrough:"Four-mode overview", videos:"Choose a video", heading:["Introducing NanoCoFold","Install NanoCoFold on Ubuntu","Explore the four analysis modes","Run ten EGFR nanobody variants"],
    audio:"English narration · English and Korean subtitles", download:"Download MP4", guide:"Installation and walkthrough guide", release:"Release v0.4.8", chapters:"Jump to a chapter",
    legacy:"Download the earlier Korean-narrated recording", status:"The video could not load. Use the MP4 download below."
  };
  const chapterNames = {inputs:"Get the example inputs", hotspots:"Understand the two proteins and their numbers", variants:"Set up ten variants", results:"Read your result", database:"Search your database", zip:"Open the downloaded ZIP"};
  const requestedChapter = q.get("chapter");
  const firstChapter = id === "first-run" && Object.hasOwn(chapterNames,requestedChapter) ? requestedChapter : "";
  const url = (v, lang) => "?v=" + v + "&lang=" + lang + (v === id && firstChapter ? "&chapter="+firstChapter : "");
  const fmt = t => Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
  ids.forEach(key => {
    const a = get(key); a.textContent = labels[key]; a.href = url(key,language);
    if (key === id) a.setAttribute("aria-current","page");
  });
  for (const lang of ["ko","en"]) {
    const a = get(lang); a.href = url(id,lang); if (lang === language) a.setAttribute("aria-current","true");
  }
  const video = get("player");
  get("choices").setAttribute("aria-label",labels.videos);
  get("heading").textContent = labels.heading[ids.indexOf(id)];
  document.title = get("heading").textContent + " · NanoCoFold";
  get("meta").textContent = fmt(Math.round(item.duration)) + " · " + labels.audio;
  get("download").textContent = labels.download; get("download").href = release + item.file;
  get("guide").textContent = labels.guide; get("guide").href = repo + "/blob/main/docs/walkthrough." + language + ".md";
  get("release").textContent = labels.release;
  if(id==="first-run"){
    const inputs=get("example-data");
    inputs.hidden=false;
    inputs.textContent=ko?"실습 입력 ZIP":"Download the input ZIP";
    inputs.href=release+"NanoCoFold-EGFR-10-inputs.zip";
    const result=get("recorded-result");
    result.hidden=false;
    result.href=release+"NanoCoFold-EGFR-10-report.zip";
    result.textContent=ko?"영상의 결과 ZIP":"Download the recorded result";
  }
  get("status").textContent = labels.status;
  video.poster = id + ".english.jpg";
  const cc=get("cc"), spoken=get("spoken"), tracks=[];
  get("cclabel").textContent=ko?"자막":"Subtitles";
  cc.querySelector('[value="off"]').textContent=ko?"끄기":"Off";
  cc.value=language;
  const placeCaptions = () => {
    const native=Boolean(document.fullscreenElement || video.webkitDisplayingFullscreen);
    for (const track of tracks) track.mode=track.language===cc.value?(native?"showing":"hidden"):"disabled";
    spoken.hidden=native || cc.value==="off"; refreshCaption();
  };
  const refreshCaption = () => {
    const active=tracks.find(t=>t.language===cc.value);
    spoken.textContent=active && active.activeCues ? Array.from(active.activeCues,c=>c.text).join(" ").replace(/\s*\n\s*/g," ") : "";
  };
  for (const code of [language, language==="ko" ? "en" : "ko"]) {
    const track = document.createElement("track");
    track.kind="subtitles"; track.srclang=code; track.label=code==="ko"?"한국어":"English"; track.src=id+".english."+code+".vtt"+(id==="first-run"?"?edition=4e078c06f68c":"");
    video.append(track); tracks.push(track.track);
    track.track.addEventListener("cuechange",refreshCaption);
    track.addEventListener("load",refreshCaption);
    const sub = document.createElement("a");
    sub.id = "subtitle-"+code;
    sub.href = release + (id==="first-run" ? "NanoCoFold-first-run."+code+".srt" : item.file.replace(".mp4",".cc."+code+".srt"));
    sub.textContent = ko ? (code==="ko"?"한국어 자막":"영어 자막")+" (SRT)" : (code==="en"?"English":"Korean")+" subtitles (SRT)";
    get("captions").append(sub);
  }
  cc.addEventListener("change",placeCaptions);
  document.addEventListener("fullscreenchange",placeCaptions);
  video.addEventListener("webkitbeginfullscreen",placeCaptions);
  video.addEventListener("webkitendfullscreen",placeCaptions);
  placeCaptions();
  if (item.chapters.length > 1) {
    const details=get("chapters"); details.hidden=false; details.querySelector("summary").textContent=labels.chapters;
    for (const mark of item.chapters) {
      const li=document.createElement("li"), btn=document.createElement("button"), time=document.createElement("time");
      time.textContent=fmt(mark.start); btn.type="button"; btn.append(time,mark[language]); li.append(btn); details.querySelector("ol").append(li);
      btn.addEventListener("click",() => {
        const seek=()=>{video.currentTime=mark.start;video.play().catch(()=>{});};
        if(video.readyState>=1) seek();
        else {video.addEventListener("loadedmetadata",seek,{once:true});video.play().catch(()=>{});}
      });
    }
  }
  if(["intro","walkthrough"].includes(id)){
    const box=get("legacy"); box.hidden=false;
    box.firstElementChild.href=release+"NanoCoFold-"+id+"-ko.mp4";
    box.firstElementChild.textContent=labels.legacy;
  }
  if (firstChapter) {
    const firstInput = item.chapters.find(mark => mark.en === chapterNames[firstChapter]);
    if (firstInput) video.addEventListener("loadedmetadata", () => { video.currentTime = firstInput.start; }, {once:true});
  }
  const sources=["media/"+item.file,release+item.file];
  let current=0;
  video.addEventListener("error",()=>{ if(++current<sources.length) video.src=sources[current]; else get("status").hidden=false; });
  if (item.stream) {
    const mp4Fallback = () => {
      current = sources.length-1;
      video.src = release + item.file;
    };
    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      current = 0;
      video.src = item.stream;
    } else {
      const script = document.createElement("script");
      script.src = "vendor/hls.light.min.js";
      script.onerror = mp4Fallback;
      script.onload = () => {
        if (!window.Hls || !Hls.isSupported()) { mp4Fallback(); return; }
        const hls = new Hls();
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data.fatal) { hls.destroy(); mp4Fallback(); }
        });
        hls.loadSource(item.stream);
        hls.attachMedia(video);
      };
      document.head.append(script);
    }
  } else video.src=sources[0];
})();
</script>
</body>
</html>
