name: Public release checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --junitxml=test-results.xml
        env:
          NANOCOFOLD_WORKFLOW_TEST: "1"
          NANOCOFOLD_BROWSER_TEST: "1"
      - run: python -m build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest tests/test_supplied_html_boot.py --junitxml=supplied-html-results.xml
        env:
          NANOCOFOLD_BROWSER_TEST: "1"
          NANOCOFOLD_SUPPLIED_INSTALLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            test-results.xml
            supplied-html-results.xml
            dist/*
